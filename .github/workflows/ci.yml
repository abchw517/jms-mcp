name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest -q
      - run: uv build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jms-mcp:ci .
      - run: docker run --rm jms-mcp:ci --version
      - name: Verify isolated runtime
        run: |
          docker run --rm --network=none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --entrypoint /app/.venv/bin/python jms-mcp:ci -c \
            'import importlib.util, os, jms_mcp; assert os.geteuid() == 10001; import sys; assert sys.version_info[:2] == (3, 11); assert jms_mcp.__file__.startswith("/app/.venv/"); assert importlib.util.find_spec("pytest") is None'
      - name: Verify offline catalog
        run: |
          docker run --rm --network=none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop=ALL \
            --security-opt=no-new-privileges \
            -v "$PWD/tests/fixtures:/fixtures:ro" \
            jms-mcp:ci catalog --schema /fixtures/jumpserver-3.10.15-minimal.json
